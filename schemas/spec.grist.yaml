# Capability spec contract — replaces OpenSpec's openspec/specs/<capability>/spec.md. Long-lived;
# re-read by every change proposal. Distinct from change.grist.yaml (per-change) and prd.grist.yaml (BMAD).
# File: openspec/specs/<capability>/spec.grist.yaml. Example: schemas/examples/spec.example.grist.yaml.
# req = required; everything else optional — omit empty/null keys in emitted artifacts.

spec: <capability-slug>           # req, kebab-case, matches folder name
version: <semver>                 # bumped on each archive merge
status: active|deprecated         # default active
purpose: <one-line, ≤200 chars>   # req
requirements:                     # req
  - id: req-1                     # req, monotonic per spec
    req: SHALL <statement>        # SHALL/MUST for normative requirements
    scenarios:                    # ≥1 per requirement
      - {id: s1, when: <trigger>, then: <expected outcome>}   # id only if cross-referenced
    notes: [<one-line>]
history:                          # appended on each archive merge
  - {change: <change-id>, date: <YYYY-MM-DD>, delta: <one-line, e.g. "added req-N, modified req-M">}
