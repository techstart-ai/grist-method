# Change proposal contract — replaces OpenSpec's proposal.md + design.md + tasks.md + specs/ set.
# File: openspec/changes/<change-id>/change.grist.yaml. Example: schemas/examples/change.example.grist.yaml.
# req = required; everything else optional — omit empty/null keys (including empty delta ops).

change: <kebab-id>                # req, e.g. add-okta-mfa, matches folder name
spec: <feature-slug>              # req, capability being changed (matches openspec/specs/<feature>/)
status: proposed|approved|implementing|done|withdrawn   # req
why: <one-line motivation, ≤200 chars>   # req
delta:                            # req; three operations, omit unused ones
  add:
    - id: req-N                   # new req id, monotonic in feature
      req: SHALL <statement>      # SHALL/MUST normative text
      scenarios: [<one-line>]
  modify:
    - {id: <existing-req-id>, from: <one-line current>, to: <one-line new>, reason: <one-line>}   # id refs spec#<feature>#<req-id>
  remove:
    - {id: <existing-req-id>, reason: <one-line>}
design:                           # replaces design.md prose
  approach: <one-line chosen approach>
  alts: [{option: <one-line>, rejected: <one-line reason>}]
  affects: [arch#C1]              # arch components touched
tasks:                            # replaces tasks.md
  - {id: t1, do: <one-line action>, files: [<path>]}
risks:                            # change-specific, not whole-spec
  - {id: cr1, risk: <one-line>, mitigation: <one-line>}
migration:                        # only if data/state migration required
  required: true|false
  steps: [<one-line>]             # only if required
  rollback: <one-line>
