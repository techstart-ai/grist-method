# Review findings contract — replaces markdown "Review Findings" bullets from bmad-code-review.
# File: review-<story_key>.grist.yaml (one per review pass). Later passes address findings by review#<key>#f<n>.
# Filled example: schemas/examples/review.example.grist.yaml.
# req = required; everything else optional — omit empty/null keys in emitted artifacts.

review: <story_key>               # req, matches story (S1.1 or 1-2-user-auth)
story: prd#<slug>#<story_key>     # req, ref to story
date: <YYYY-MM-DD>                # req
mode: full|no-spec                # matches bmad-code-review review_mode
diff_source: <branch, commit range, PR url, or "uncommitted">
spec: <path>                      # spec used by Acceptance Auditor (prefer .grist.yaml)
layers_ran: [blind, edge, auditor]
failed_layers: [<layer>]          # only if a layer failed
findings:                         # flat list, post-triage
  - id: f1                        # req, sequential
    class: patch|decision-needed|defer|dismiss    # req
    severity: low|med|high|crit
    source: blind|edge|auditor    # merged layers as blind+edge
    loc: <path:line>              # req if known
    title: <one-line>             # req
    detail: <one-line, ≤200 chars>  # req
    fix: <one-line>               # req for class=patch
    ac_ref: ac<n>                 # auditor findings only — which AC violated
counts: {decision_needed: 0, patch: 0, defer: 0, dismissed: 0}   # req summary
resolutions:                      # populated as findings are addressed
  - {finding: f1, status: pending|resolved|deferred|wontfix, resolved_in: <sha>, note: <one-line>}
