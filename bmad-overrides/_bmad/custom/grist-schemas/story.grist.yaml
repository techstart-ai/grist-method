# Story contract — replaces BMAD's story-N.md. File: story-S<n>.<m>.grist.yaml (one per story).
# Filled example: examples/story.example.grist.yaml.
# req = required; everything else optional — omit empty/null keys in emitted artifacts.

story: S1.1                       # req, S<epic>.<n>
epic: prd#E1                      # req, ref to PRD epic
prd: prd#<slug>                   # req, ref to PRD root
arch: arch#C1                     # ref to primary arch component, for traceability
title: <one-line>                 # req
why: <one-line value>             # drop if obvious from epic
tasks:                            # req; order = execution order
  - {id: t1, do: <one-line action>, files: [<path>]}   # files = hint for dev agent
ac:                               # req; what dev must demo before story closes
  - {id: ac1, test: <testable one-liner>, auto: true|false}   # auto = automated test exists
files:                            # dev agent's read scope — keep tight
  - {path: <path>, op: new|modify}
deps: [S1.0]                      # stories that must complete first
status: backlog|in-progress|in-review|done|blocked    # req, sprint tracker reads this
blockers: [<one-line>]            # only if status=blocked
