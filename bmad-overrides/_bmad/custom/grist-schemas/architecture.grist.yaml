# Architecture contract — replaces BMAD's architecture.md. File: architecture.grist.yaml.
# Filled example: examples/architecture.example.grist.yaml.
# req = required; everything else optional — omit empty/null keys in emitted artifacts.

arch: <slug>                      # req, matches prd slug or own slug
prd: prd#<slug>                   # req, ref to PRD — never re-paste PRD content
stack:                            # flat dict, ≤8 entries, one keyword each (runtime, framework, db, cache, queue, iac, ...)
  runtime: <node20>
  db: <postgres16>
components:
  - id: C1                        # C<n>
    name: <kebab-case-name>
    type: service|data|ui|external|lib   # req
    tech: <nestjs>
    responsibilities: [<one-line>]       # ≤5
    deps: [C2, okta]              # component ids or external systems
    schema: <one-line>            # data components only, e.g. "sess:{uid} → {jwt, refresh, exp}"
decisions:                        # WHY lives here — replaces ADR/decision prose
  - id: d1
    decision: <one-line>
    why: <one-line>
    alts: [{option: <one-line>, rejected: <one-line reason>}]
interfaces:                       # contract surface between components or to clients
  - {id: i1, from: C1, to: C2, contract: <one-line>, protocol: http|grpc|queue|fs|other}
nfrs: [<measurable one-liner>]
risks:                            # architecture-level (PRD risks are product-level)
  - {id: ar1, risk: <one-line>, mitigation: <one-line>}
