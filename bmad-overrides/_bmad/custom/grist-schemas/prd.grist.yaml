# PRD contract — replaces BMAD's PRD.md. File: prd.grist.yaml (or prd-<slug>.grist.yaml multi-PRD).
# Filled example: examples/prd.example.grist.yaml. Converter: converters/bmad-prd-to-grist.py.
# req = required; everything else optional — omit empty/null keys in emitted artifacts.

prd: <slug>                       # req, kebab-case, unique in project
phase: planning|solutioning|implementation|done   # req
inputs: [brief.md]                # upstream artifact refs
problem: <one-line, ≤200 chars>   # req
goal: <one-line, ≤200 chars>      # req
nonGoals: [<one-line>]            # explicit out-of-scope
invariants: [<one-line>]          # MUST hold across all stories
epics:                            # req
  - id: E1                        # E<n>
    title: <one-line>
    why: <one-line rationale>
    stories: [S1.1, S1.2]         # ids only — stories live in story.grist.yaml files
acceptance:                       # project-level; story-level AC lives in story files
  - {id: ac1, criterion: <testable one-liner>}
risks:
  - {id: r1, risk: <one-line>, mitigation: <one-line>, severity: low|med|high}
nfrs: [<measurable one-liner>]    # e.g. "p95 < 200ms for /auth/*"
stakeholders: [<role: name>]      # traceability only
approvals: {pm: <date>, architect: <date>, eng-lead: <date>}   # omit unapproved entries
