name: Smoke Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Run BMAD Claude Code Smoke Test
      run: ./test/smoke-test.sh
      
    - name: Run OpenSpec Claude Code Smoke Test
      run: ./test/smoke-test-openspec.sh

    - name: Run Cursor Smoke Test
      run: ./test/smoke-test-cursor.sh

    - name: Run Compression Ratio Check
      run: ./test/smoke-test-ratio.sh

    - name: Run Auto-Activation Hook Smoke Test
      run: ./test/smoke-test-autoactivate.sh

    - name: Run Review Pipeline Smoke Test
      run: ./test/smoke-test-review.sh

    - name: Run Converter Unit Tests
      run: python3 -m unittest discover converters -v

    - name: Run Gristats CLI Checks
      run: |
        python3 gristats/gristats.py project examples/auth-v2/
        python3 converters/bmad-prd-to-grist.py examples/auth-v2/PRD.md > /tmp/check.yaml
        python3 gristats/grist-get.py 'prd#E1' --dir examples/auth-v2
        python3 gristats/grist-get.py --list prd --dir examples/auth-v2
        python3 gristats/grist-render.py schemas/examples/review-pr.example.grist.yaml > /tmp/review.md
        python3 gristats/grist-diff.py HEAD~1...HEAD
