name: grist
version: 1
description: |
  Token-efficient OpenSpec workflow. Replaces the 4-file (proposal.md + design.md +
  tasks.md + specs/) layout with a single change.grist.yaml carrying proposal +
  design + spec deltas + tasks. A thin tasks.md is emitted alongside so OpenSpec's
  apply phase can still track checkboxes. Typical change set drops from 3-8kb of
  prose to 400-800 bytes.

artifacts:
  - id: change
    generates: change.grist.yaml
    description: Single-file structured change record (proposal + design + spec deltas + tasks)
    template: change.grist.yaml
    instruction: |
      Emit ONE YAML document at change.grist.yaml. It replaces proposal.md +
      design.md + tasks.md + specs/<capability>/spec.md.

      Required fields:
        change:   kebab-id matching the change folder name
        spec:     target spec slug (capability being changed)
        status:   proposed | approved | implementing | done | withdrawn
        why:      one-line motivation, ≤200 chars
        delta:    add {id, req, scenarios} / modify {id, from, to, reason} /
                  remove {id, reason} — omit unused operations entirely
        design:   approach (one-line) + alts [{option, rejected}] + affects [arch#C1]
        tasks:    [{id, do, files}] — imperative one-liners; files = read/write scope
      Optional (omit when empty/none): risks [{id, risk, mitigation}],
        migration {required, steps, rollback}.

      Tight style: no comments in the emitted artifact; flow lists [a, b, c] for
      scalars; omit ALL empty/null optional keys (never `risks: []` or
      `remove: []`); one-line scalars ≤200 chars; compact ids (req-7, t1, cr1);
      no trailing blank sections. Spec deltas use SHALL/MUST in `req:` text;
      scenarios are one-liners. Reference existing specs by ID
      (spec#<feature>#req-<n>), never re-paste. Rationale lives in `reason:` and
      `alts[].rejected:` — no prose paragraphs.

      The template templates/change.grist.yaml shows the shape — read it only
      if unsure after this instruction.
    requires: []

  - id: tasks
    generates: tasks.md
    description: Checkbox mirror of change.grist.yaml.tasks (for /opsx:apply tracking)
    template: tasks.md
    instruction: |
      Read change.grist.yaml. For each entry under `tasks:`, emit one checkbox
      line in tasks.md, the format OpenSpec's apply phase parses:

        ## 1. Implementation

        - [ ] 1.<n> <task.do>

      <n> is the 1-based task index. No other content, prose, or headers —
      the design lives in change.grist.yaml. When a task completes, /opsx:apply
      ticks the box here AND sets tasks[i].done: true in the YAML.
    requires:
      - change

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read change.grist.yaml as primary context — spec deltas, design, and task
    list with `files:` hints. Use tasks.md only for checkbox tracking.

    When checking off a task: set [x] in tasks.md AND tasks[i].done: true in
    change.grist.yaml (tight style: no comments, no empty/null optional keys).

    Operating mode: /grist ship.
      - No preambles ("Let me", "I'll now", "First I'll").
      - No end-of-turn summaries — the diff IS the record. No task restatement.
      - Code, tests, comments, commits: zero compression — normal style.
      - Read discipline: never read whole files >300 lines without a line range;
        quote ≤5 lines from any doc, reference rest by path:line.

    On blockers, halt and ask. Don't speculate.

archive:
  instruction: |
    On archive, merge change.grist.yaml.delta into the long-lived specs:

      For each entry in delta.add / delta.modify / delta.remove, locate the
      target spec at openspec/specs/<spec>/spec.grist.yaml (preferred) or
      openspec/specs/<spec>/spec.md (legacy fallback) and apply.

      .grist.yaml target: structural merge — append/replace/remove req entries
      by id. .md target: best-effort markdown merge (OpenSpec standard archive
      logic) until migrated via openspec-spec-to-grist.py.

    After merge, move the change folder to
    openspec/changes/archive/<date>-<change-id>/ as OpenSpec normally does.
