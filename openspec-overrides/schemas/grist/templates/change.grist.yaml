# Change record contract — replaces proposal.md + design.md + tasks.md + specs/ edits.
# Filled by /opsx:propose under schema=grist. Emit tight: no comments, omit empty/null optional keys.

change: <kebab-change-id>          # req, matches folder name
spec: <feature-slug>               # req, capability being changed
status: proposed|approved|implementing|done|withdrawn   # req
why: <one-line motivation, ≤200 chars>   # req
delta:                             # req; omit unused operations
  add:
    - id: req-N                    # monotonic in feature
      req: SHALL <statement>       # SHALL/MUST normative text
      scenarios: [<one-line WHEN/THEN>]
  modify:
    - {id: <existing-req-id>, from: <one-line current>, to: <one-line new>, reason: <one-line>}
  remove:
    - {id: <existing-req-id>, reason: <one-line>}
design:                            # replaces design.md prose
  approach: <one-line chosen approach>
  alts: [{option: <one-line>, rejected: <one-line reason>}]
  affects: [arch#C<n>]             # arch components touched
tasks:                             # mirrored to tasks.md checkboxes for /opsx:apply
  - {id: t1, do: <one-line imperative action>, files: [{path: <path>, op: new|modify}], done: false}
risks:                             # change-specific only
  - {id: cr1, risk: <one-line>, mitigation: <one-line>}
migration:                         # only if data/state migration required
  required: true|false
  steps: [<one-line>]              # only if required
  rollback: <one-line>
